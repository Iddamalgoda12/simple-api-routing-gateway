[package]
name = "simple-api-routing-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small configurable HTTP reverse proxy gateway"
license = "MIT"

[dependencies]
axum = "0.8.9"
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
serde-saphyr = "1.3"
